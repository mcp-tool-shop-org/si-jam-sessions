name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The page's recordings are release assets, not files in git. Each must match the
      # SHA-256 committed in site/audio.sha256, or the build stops before anything deploys.
      - name: Fetch the recordings from the release, checked against their SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/public/audio
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --dir site/public/audio \
            --pattern 'battle-hymn-*.mp3' --pattern 'battle-hymn-*.opus'
          cd site/public/audio && sha256sum --check --strict ../../audio.sha256

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
