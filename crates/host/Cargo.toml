[package]
name = "host"
version = "0.1.0"
description = "The native host of si-jam-sessions: plays committed frames through oscillator voices and a click, and takes a live take."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A native binary. It drives the law through the same extern "C" exports the
# wasm has, and it is never part of the law's wasm (CI builds only `-p law` for
# wasm32-unknown-unknown).
[dependencies]
law = { path = "../law" }
# The committed score's inputs and the constructed take, exactly as the golden
# builds them.
golden = { path = "../golden" }
# WASAPI shared mode on Windows (PHASE-0's native-host pin); ALSA on Linux,
# where CI builds and tests the host without a device.
cpal = { version = "=0.18.2", default-features = false }
# The single-producer single-consumer rings into and out of the audio callback.
rtrb = "=0.4.0"
# The piano: its FLAC samples decoded, in pure Rust (Apache-2.0).
claxon = "=0.4.3"
# fetch-piano: the sample archive's gzip stream, inflated by miniz_oxide in
# pure Rust (flate2: MIT OR Apache-2.0).
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# fetch-piano: the archive's SHA-256, with the pin the law and the golden use.
sha2 = { version = "=0.11.0", default-features = false }
# preview: a MIDI file read by the law's own SMF reader, which is not the law
# (score-model is its integer score), and its sustain-pedal messages counted
# with the same pinned midly. The tests also build scores of their own in the
# law's score layout with score-model.
ingest = { path = "../ingest" }
score-model = { path = "../score-model" }
midly = { version = "=0.5.3", default-features = false, features = ["alloc", "strict"] }

# WinMM MIDI input and the console keyboard, through the same windows crate
# cpal links on Windows (MIT OR Apache-2.0).
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
