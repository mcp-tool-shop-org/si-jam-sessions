[package]
name = "law"
version = "0.1.0"
description = "The deterministic law of si-jam-sessions: integer musical time, the take, grading, and a hashed snapshot."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# One wasm32-unknown-unknown cdylib is the law's binary; the rlib is what the
# native tests and a native harness link.
[lib]
crate-type = ["cdylib", "rlib"]

# Declared here rather than in [workspace.dependencies], so this crate's manifest
# is the one place its dependencies change.
[dependencies]
score-model = { path = "../score-model" }
# The ingest verb: the licence predicate admits a score before the SMF reader
# reads it. Both are no_std + alloc and build for wasm32-unknown-unknown.
provenance = { path = "../provenance" }
ingest = { path = "../ingest" }
# SHA-256 of the canonical snapshot. No default features: no alloc, no OIDs.
sha2 = { version = "0.11.0", default-features = false }
