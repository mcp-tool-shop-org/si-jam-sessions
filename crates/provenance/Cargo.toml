[package]
name = "provenance"
version = "0.1.0"
description = "The receipt a score arrives with, and the licence predicate that admits or refuses it."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Unlicense. `strict` makes a malformed file an error instead of a silently shortened one.
midly = { version = "=0.5.3", default-features = false, features = ["alloc", "strict"] }
# MIT OR Apache-2.0. No default features: no std, no OID tables.
sha2 = { version = "=0.11.0", default-features = false }
